[package]
name = "au-scriptpipe"
version.workspace = true
edition.workspace = true
description = "Audacity mod-script-pipe transport for a Rust Audacity port"
license.workspace = true

[dependencies]
au-runtime = { path = "../au-runtime" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Security",
] }


