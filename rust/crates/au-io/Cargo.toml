[package]
name = "au-io"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
au-core = { path = "../au-core" }
au-effects = { path = "../au-effects" }
thiserror = "1"
symphonia = { version = "0.5", features = ["wav","flac","mp3","vorbis","ogg","pcm"] }
hound = "3.5"
libloading = "0.8"
midly = "0.5"
rubato = "0.15"
rtrb = "0.3"
flacenc = "0.4"
cpal = { version = "0.15", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_Foundation"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

[features]
default = ["device"]
device = ["cpal"]
