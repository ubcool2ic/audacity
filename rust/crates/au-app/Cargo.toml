[package]
name = "au-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
au-core = { path = "../au-core" }
au-io = { path = "../au-io" }
au-effects = { path = "../au-effects" }
au-plugin-api = { path = "../au-plugin-api" }
au-project = { path = "../au-project" }
au-runtime = { path = "../au-runtime" }
rustfft = "6"
png = "0.18"
au-plugin-host = { path = "../au-plugin-host" }
au-scriptpipe = { path = "../au-scriptpipe" }
au-script = { path = "../au-script" }
au-nyquist = { path = "../au-nyquist" }
eframe = { version = "0.29", optional = true, default-features = false, features = ["glow","default_fonts","x11","wayland","accesskit"] }
raw-window-handle = { version = "0.6", optional = true }
rfd = { version = "0.15", optional = true }

[features]
default = []
gui = ["dep:eframe", "dep:rfd", "dep:raw-window-handle"]

[[bin]]
name = "audacity-rs"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
